# Builds the page and publishes it to GitHub Pages on every push to master.
#
# The repository's Pages source has to be "GitHub Actions" (Settings, Pages),
# once. Nothing built is checked in: the WebAssembly module is compiled here
# from go-zenon at the commit go-zenon/PIN names, and the build stops if the
# tree it fetched is not the tree the pin says.
#
# A build that fails a test publishes nothing, and the page that was up stays
# up. The tests are the ones that prove the page's offline mode: every
# scenario on the in-process chain natively, then the shipped module in Node.
name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push does not cancel one that is already
# publishing: a half-finished deploy is the one state Pages should not be in.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: sim/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the chain and the scenarios to WebAssembly
        run: sh scripts/build-sim.sh

      - name: Every scenario on the in-process chain
        working-directory: sim
        run: go test ./...

      - name: Every scenario in the module that ships
        run: node scripts/check-sim.mjs --all

      - name: Build the page
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
